<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1150" viewBox="0 0 560 1150" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Two AWS application paths</title><desc id="svg-desc">Foundation private EC2 and Delivery private ECS both read one protected RDS; governance is separate.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto-start-reverse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#24776d"/></marker></defs><rect x="0" y="0" width="560" height="1150" rx="12" fill="#f6f8f7" stroke="#f6f8f7" stroke-width="2" /><rect width="560" height="72" fill="#193d3f"/><text x="20" y="46" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#fff">Two AWS application paths</text><text x="20" y="113" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">LIVE AWS LAB · RETIRED</text><rect x="52" y="146" width="488" height="144" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" /><text x="73" y="188" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">FOUNDATION VPC</text><text x="73" y="226" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">HTTPS → ALB + WAF</text><text x="73" y="258" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Private EC2 in two AZs</text><rect x="52" y="366" width="488" height="144" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" /><text x="73" y="408" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">DELIVERY VPC</text><text x="73" y="446" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">HTTPS → ALB</text><text x="73" y="478" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Private ECS Fargate tasks</text><path d="M52 218 H29 V776 H49" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><path d="M290 510 V700" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><text x="46" y="328" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Direct private database route</text><text x="46" y="555" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Peering + return routes to RDS</text><text x="46" y="599" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">IAM database reader + MySQL TLS</text><rect x="52" y="712" width="488" height="144" rx="12" fill="#e4f1ed" stroke="#bfd0cd" stroke-width="2" /><text x="73" y="754" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">PRIVATE RDS · FOUNDATION</text><text x="73" y="792" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Encrypted MySQL database</text><text x="73" y="824" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Same three test records</text><text x="20" y="903" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">OPERATIONAL CONTROLS</text><rect x="20" y="930" width="518" height="97" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="42" y="969" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Incident evidence + recovery</text><text x="42" y="1006" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Release identity + rollback</text><rect x="20" y="1043" width="518" height="79" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" stroke-dasharray="8 7"/><text x="42" y="1078" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Governance designed separately</text><text x="42" y="1108" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">AI rule tested in one AWS account</text></svg>