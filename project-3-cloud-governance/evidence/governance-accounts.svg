<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1080" viewBox="0 0 680 1080" role="img" aria-labelledby="title desc">
<title id="title">Six-account AWS Cloud Governance design</title>
<desc id="desc">Terraform design for six accounts: the AWS Organizations management account controls organization structure, three organization units organize five member accounts. Security and Log Archive are in the Security OU; Shared Services is in Infrastructure; NonProd and Prod are in distinct workload OUs. This structure was validated offline, not deployed as a six-account organization.</desc>
