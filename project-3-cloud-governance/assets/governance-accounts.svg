<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1270" viewBox="0 0 560 1270" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">AWS governance hierarchy</title><desc id="svg-desc">Offline AWS Organizations structure: management account, sibling Security, Infrastructure and Workloads OUs. Workloads contains separate NonProd and Prod OUs, each containing its member account. Security and Infrastructure accounts are in their respective OUs.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto-start-reverse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#24776d"/></marker></defs><rect width="560" height="1270" fill="#f6f8f7"/><rect width="560" height="72" fill="#193d3f"/><text x="20" y="46" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">AWS governance hierarchy</text><text x="20" y="110" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#895a1c">OFFLINE DESIGN · NOT DEPLOYED</text><rect x="110" y="134" width="430" height="107" rx="12" fill="#e4f1ed" stroke="#bfd0cd" stroke-width="2" /><text x="133" y="178" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">MANAGEMENT ACCOUNT</text><text x="133" y="216" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Organizations root · SCPs</text><path d="M110 188 H75 V1111" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><path d="M75 303 H106" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><rect x="108" y="271" width="432" height="241" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="131" y="312" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">SECURITY OU</text><rect x="128" y="331" width="392" height="74" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="150" y="362" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Security account</text><text x="150" y="389" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Findings + triage</text><rect x="128" y="420" width="392" height="73" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="150" y="453" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Log Archive account</text><text x="150" y="478" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Protected audit records</text><path d="M75 563 H106" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><rect x="108" y="530" width="432" height="153" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="131" y="569" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">INFRASTRUCTURE OU</text><rect x="128" y="591" width="392" height="74" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="150" y="624" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Shared Services account</text><text x="150" y="649" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Common platform resources</text><path d="M75 741 H106" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  /><rect x="108" y="702" width="432" height="409" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="131" y="742" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">WORKLOADS OU</text><rect x="130" y="760" width="388" height="155" rx="12" fill="#ffffff" stroke="#a3c5bf" stroke-width="2" /><text x="149" y="793" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">NONPROD OU</text><rect x="149" y="810" width="349" height="81" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="170" y="843" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">NonProd account</text><text x="170" y="872" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Development workload</text><rect x="130" y="932" width="388" height="156" rx="12" fill="#ffffff" stroke="#a3c5bf" stroke-width="2" /><text x="149" y="965" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">PROD OU</text><rect x="149" y="983" width="349" height="82" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="170" y="1016" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Prod account</text><text x="170" y="1045" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Production workload</text><text x="20" y="1162" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Root SCP: deny leave · member accounts</text><text x="20" y="1199" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">NonProd / Prod OU: security guardrails</text><text x="20" y="1235" font-size="20" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">AI triage tested separately in one account</text></svg>