name: CI - Test and Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: Run manual Terraform quality gates
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform quality gates (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_terraform == true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infrastructure/bootstrap-state
          - infrastructure/project-1-cloud-platform
          - infrastructure/project-2-ecs-cicd/bootstrap-delivery
          - infrastructure/project-2-ecs-cicd/terraform
          - infrastructure/project-3-cloud-governance/organization
          - infrastructure/project-3-cloud-governance/security-admin
          - infrastructure/project-3-cloud-governance/log-archive
          - infrastructure/project-3-cloud-governance/audit-trail
          - infrastructure/project-3-cloud-governance/identity-center
          - infrastructure/project-3-cloud-governance/workload
          - infrastructure/project-3-cloud-governance/finops-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.6
      - name: Terraform format
        run: terraform fmt -check -recursive "${{ matrix.directory }}"
      - name: Terraform init without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
      - name: TFLint
        working-directory: ${{ matrix.directory }}
        run: |
          tflint --init
          tflint --recursive

  python:
    name: Python tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infrastructure/project-2-ecs-cicd/app/requirements.txt
      - name: Install app and test tooling
        run: |
          pip install -r infrastructure/project-2-ecs-cicd/app/requirements.txt
          pip install pytest==9.1.1 pip-audit==2.10.1 ruff==0.16.10
      - name: Ruff correctness checks
        run: >-
          ruff check --select E,F,I --ignore E501
          infrastructure/project-1-cloud-platform/ai_log_summarizer.py
          infrastructure/project-2-ecs-cicd/app
          infrastructure/project-3-cloud-governance/security-admin/ai_incident_analyzer.py
          infrastructure/project-3-cloud-governance/finops-ai/cost_analyzer.py
          infrastructure/project-3-cloud-governance/workload/dashboard_api.py
      - name: Pytest
        run: >-
          pytest -q
          infrastructure/project-2-ecs-cicd/app/tests
          tests
      - name: Governance and AI Lambda syntax
        run: |
          python -m py_compile infrastructure/project-1-cloud-platform/ai_log_summarizer.py
          python -m py_compile infrastructure/project-3-cloud-governance/security-admin/ai_incident_analyzer.py
          python -m py_compile infrastructure/project-3-cloud-governance/finops-ai/cost_analyzer.py
          python -m py_compile infrastructure/project-3-cloud-governance/workload/dashboard_api.py
      - name: Dependency audit
        run: pip-audit -r infrastructure/project-2-ecs-cicd/app/requirements.txt

  iac-security:
    name: IaC security scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12
        with:
          directory: infrastructure
          framework: terraform
          config_file: .checkov.yml
          quiet: true
          soft_fail: true

  container:
    name: Container build and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image
        working-directory: infrastructure/project-2-ecs-cicd/app
        run: docker build -t rsvp-project2:${GITHUB_SHA} .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsvp-project2:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
