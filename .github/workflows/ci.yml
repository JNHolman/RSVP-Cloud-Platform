name: CI - Test and Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_terraform:
        description: Run Terraform quality gates on demand
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project3-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-3-cloud-governance/modules/scp-policies
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.6
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  terraform:
    name: Terraform quality gates
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_terraform == true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        directory:
          - shared/bootstrap-state
          - project-1-cloud-foundation/terraform
          - project-2-ecs-cicd/bootstrap-delivery
          - project-2-ecs-cicd/terraform
          - project-3-cloud-governance/organization
          - project-3-cloud-governance/security-admin
          - project-3-cloud-governance/log-archive
          - project-3-cloud-governance/audit-trail
          - project-3-cloud-governance/identity-center
          - project-3-cloud-governance/workload
          - project-3-cloud-governance/finops-ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.6.6
      - name: Terraform format
        run: |
          terraform fmt -recursive "${{ matrix.directory }}"
          git diff --exit-code -- "${{ matrix.directory }}"
      - name: Terraform init without backend
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate
      - name: TFLint (pinned container)
        working-directory: ${{ matrix.directory }}
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo" \
            --workdir "/repo/${{ matrix.directory }}" \
            --entrypoint /bin/sh \
            ghcr.io/terraform-linters/tflint:v0.65.0 \
            -c 'tflint --init && tflint --recursive'

  python:
    name: Python tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project-2-ecs-cicd/app/requirements.txt
      - name: Install app and test tooling
        run: |
          pip install -r project-2-ecs-cicd/app/requirements.txt
          pip install pytest==9.1.1 "moto[dynamodb]==5.1.14" pip-audit==2.10.1 ruff==0.16.10
      - name: Ruff correctness checks
        run: >-
          ruff check --select E,F,I --ignore E501
          project-1-cloud-foundation/terraform/ai_log_summarizer.py
          shared/incident-runtime
          project-2-ecs-cicd/app
          project-3-cloud-governance/security-admin/ai_incident_analyzer.py
          project-3-cloud-governance/finops-ai/cost_analyzer.py
          project-3-cloud-governance/workload/dashboard_api.py
      - name: Pytest
        run: >-
          pytest -q
          project-2-ecs-cicd/app/tests
          shared/tests project-1-cloud-foundation/tests project-2-ecs-cicd/tests project-3-cloud-governance/tests
      - name: Governance and AI Lambda syntax
        run: |
          python -m py_compile project-1-cloud-foundation/terraform/ai_log_summarizer.py
          python -m py_compile project-3-cloud-governance/security-admin/ai_incident_analyzer.py
          python -m py_compile project-3-cloud-governance/finops-ai/cost_analyzer.py
          python -m py_compile project-3-cloud-governance/workload/dashboard_api.py
      - name: Dependency audit
        run: pip-audit -r project-2-ecs-cicd/app/requirements.txt

  iac-security:
    name: IaC security scan (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkov
        uses: bridgecrewio/checkov-action@cc0e17d456ef1713bbfd963ebac19dc776775cb2 # v12
        with:
          directory: .
          framework: terraform
          config_file: .checkov.yml
          quiet: true
          soft_fail: true

  container:
    name: Container build and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify pinned regional RDS CA bundle
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o /tmp/rds-us-east-1-bundle.pem https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem
          echo 'b1711d12bae51838581281e23b6cb97b1074016873b4dafc80ed14002462dd77  /tmp/rds-us-east-1-bundle.pem' | sha256sum -c -
      - name: Build image
        working-directory: project-2-ecs-cicd/app
        run: docker build -t rsvp-project2:${GITHUB_SHA} .
      - name: Verify non-root container startup
        run: |
          set -eu
          container=$(docker run -d --read-only --tmpfs /tmp:ro --user app \
            -e GUNICORN_CMD_ARGS="--worker-tmp-dir /dev/shm" -e ENV_NAME=ci \
            -e APP_VERSION="$GITHUB_SHA" -p 127.0.0.1::8080 "rsvp-project2:$GITHUB_SHA")
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          endpoint=$(docker port "$container" 8080/tcp)
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 \
            "http://$endpoint/health" --output "$RUNNER_TEMP/project2-health.json"
          jq -e --arg sha "$GITHUB_SHA" \
            '.status == "ok" and .env == "ci" and .version == $sha' "$RUNNER_TEMP/project2-health.json"
          curl --fail --silent --show-error "http://$endpoint/api/reservations" |
            jq -e '.reservations == [{"id":1,"event":"Portfolio rehearsal"}]'
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rsvp-project2:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
