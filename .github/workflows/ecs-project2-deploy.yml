name: ECS Project 2 - Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, stage, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-project2-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      CONTAINER_NAME: app
    steps:
      - name: Resolve deployment configuration
        run: |
          REGION="${AWS_REGION:-us-east-1}"
          PROJECT="${PROJECT_NAME:-rsvp-project2}"
          test -n "$REGION"
          test -n "$PROJECT"
          case "$PROJECT" in
            *[!a-z0-9-]*|''|-*|*-) echo "PROJECT_NAME must use lowercase letters/numbers/hyphens and start/end with a letter or number" >&2; exit 1 ;;
          esac
          if [ "${#PROJECT}" -gt 22 ]; then
            echo "PROJECT_NAME must be 22 characters or fewer" >&2
            exit 1
          fi
          echo "AWS_REGION=$REGION" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$PROJECT-${{ inputs.environment }}-app" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$PROJECT-${{ inputs.environment }}-cluster" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$PROJECT-${{ inputs.environment }}-service" >> "$GITHUB_ENV"
          echo "ECS_TASK_DEFINITION_FAMILY=$PROJECT-${{ inputs.environment }}-task" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Pre-deploy tests
        run: |
          pip install -r infrastructure/project-2-ecs-cicd/app/requirements.txt
          pip install pytest==9.1.1
          pytest -q infrastructure/project-2-ecs-cicd/app/tests

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve immutable image
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          if OUTPUT=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
            docker pull "$IMAGE_URI"
          elif printf '%s' "$OUTPUT" | grep -q 'ImageNotFoundException'; then
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
            docker build -t "$IMAGE_URI" infrastructure/project-2-ecs-cicd/app
          else
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push new immutable image
        if: env.IMAGE_EXISTS != 'true'
        run: docker push "$IMAGE_URI"

      - name: Capture current task definition for rollback
        run: |
          PREVIOUS_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          echo "PREVIOUS_TASK_DEF=$PREVIOUS_TASK_DEF" >> "$GITHUB_ENV"

      - name: Resolve Terraform task-definition baseline
        run: |
          BASE_TASK_DEF=""
          for arn in $(aws ecs list-task-definitions \
            --family-prefix "$ECS_TASK_DEFINITION_FAMILY" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text); do
            FAMILY=$(aws ecs describe-task-definition \
              --task-definition "$arn" \
              --include TAGS \
              --query 'taskDefinition.family' \
              --output text)
            SOURCE=$(aws ecs describe-task-definition \
              --task-definition "$arn" \
              --include TAGS \
              --query "tags[?key=='ConfigurationSource'].value | [0]" \
              --output text)
            if [ "$FAMILY" = "$ECS_TASK_DEFINITION_FAMILY" ] && [ "$SOURCE" = "TerraformBaseline" ]; then
              BASE_TASK_DEF="$arn"
              break
            fi
          done
          test -n "$BASE_TASK_DEF"
          echo "BASE_TASK_DEF=$BASE_TASK_DEF" >> "$GITHUB_ENV"

      - name: Build next task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEF" \
            --query taskDefinition > task-definition.json

          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$CONTAINER_NAME" \
            --arg SHA "${GITHUB_SHA::7}" \
            '.containerDefinitions |= map(
              if .name == $CONTAINER then
                .image = $IMAGE |
                .environment = ((.environment // []) | map(select(.name != "APP_VERSION")) + [{"name":"APP_VERSION","value":$SHA}])
              else . end
            ) |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' task-definition.json > new-task-definition.json

      - name: Register task definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL"
          case "$SERVICE_URL" in
            https://*) ;;
            *) echo "SERVICE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 --retry-delay 5 "$SERVICE_URL/health" | tee health.json
          python - <<'PY'
          import json
          with open('health.json') as f:
              data=json.load(f)
          if data.get('status') != 'ok':
              raise SystemExit('health endpoint did not return status=ok')
          PY

      - name: Roll back failed deployment
        if: steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure'
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEF" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          exit 1

      - name: Verify deployed revision
        if: steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success'
        run: |
          ACTIVE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$ACTIVE" = "$TASK_DEF_ARN"
          echo "Deployment verified: $ACTIVE"
