name: ECS Project 2 - Controlled Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, stage, prod]
        default: dev
      exercise_rollback:
        description: Dev only. Deploy a deliberately mismatched version to exercise smoke-test rollback.
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-project2-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROJECT_NAME: ${{ vars.PROJECT_NAME }}
      CONTAINER_NAME: app
      RDS_SMOKE_EVENT: ${{ vars.RDS_SMOKE_EVENT }}
    steps:
      - name: Resolve deployment configuration
        env:
          EXERCISE_ROLLBACK: ${{ inputs.exercise_rollback }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          if [[ "$EXERCISE_ROLLBACK" == "true" && "$TARGET_ENV" != "dev" ]]; then
            echo "Rollback exercises require the dev environment" >&2
            exit 1
          fi
          REGION="${AWS_REGION:-us-east-1}"
          PROJECT="${PROJECT_NAME:-rsvp-project2}"
          test -n "$REGION"
          test -n "$PROJECT"
          case "$PROJECT" in
            *[!a-z0-9-]*|''|-*|*-) echo "PROJECT_NAME must use lowercase letters/numbers/hyphens and start/end with a letter or number" >&2; exit 1 ;;
          esac
          if [ "${#PROJECT}" -gt 22 ]; then
            echo "PROJECT_NAME must be 22 characters or fewer" >&2
            exit 1
          fi
          echo "AWS_REGION=$REGION" >> "$GITHUB_ENV"
          echo "PROJECT_NAME=$PROJECT" >> "$GITHUB_ENV"
          echo "ECR_REPOSITORY=$PROJECT-${{ inputs.environment }}-app" >> "$GITHUB_ENV"
          echo "ECS_CLUSTER=$PROJECT-${{ inputs.environment }}-cluster" >> "$GITHUB_ENV"
          echo "ECS_SERVICE=$PROJECT-${{ inputs.environment }}-service" >> "$GITHUB_ENV"
          echo "ECS_TASK_DEFINITION_FAMILY=$PROJECT-${{ inputs.environment }}-task" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Pre-deploy tests
        run: |
          pip install -r project-2-ecs-cicd/app/requirements.txt
          pip install pytest==9.1.1
          pytest -q project-2-ecs-cicd/app/tests

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account
        id: aws
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Resolve immutable image
        env:
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.account_id }}
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$GITHUB_SHA"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          if OUTPUT=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "IMAGE_EXISTS=true" >> "$GITHUB_ENV"
            docker pull "$IMAGE_URI"
          elif printf '%s' "$OUTPUT" | grep -q 'ImageNotFoundException'; then
            echo "IMAGE_EXISTS=false" >> "$GITHUB_ENV"
            docker build -t "$IMAGE_URI" project-2-ecs-cicd/app
          else
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi

      - name: Scan immutable image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Push new immutable image
        if: env.IMAGE_EXISTS != 'true'
        run: docker push "$IMAGE_URI"

      - name: Capture current task definition for rollback
        run: |
          PREVIOUS_TASK_DEF=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test -n "$PREVIOUS_TASK_DEF" && test "$PREVIOUS_TASK_DEF" != None
          aws ecs describe-task-definition --task-definition "$PREVIOUS_TASK_DEF" \
            --query 'taskDefinition.containerDefinitions' --output json > previous-containers.json
          PREVIOUS_VERSION=$(jq -er --arg name "$CONTAINER_NAME" \
            '.[] | select(.name == $name) | .environment[] | select(.name == "APP_VERSION") | .value' previous-containers.json)
          previous_mode=$(jq -er --arg name "$CONTAINER_NAME" '.[] | select(.name == $name) | ([.environment[]? | select(.name == "DB_MODE") | .value][0] // "fixture")' previous-containers.json)
          echo "PREVIOUS_DB_MODE=$previous_mode" >> "$GITHUB_ENV"
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_TASK_DEF=$PREVIOUS_TASK_DEF" >> "$GITHUB_ENV"

      - name: Resolve Terraform task-definition baseline
        run: |
          BASE_TASK_DEF=""
          for arn in $(aws ecs list-task-definitions \
            --family-prefix "$ECS_TASK_DEFINITION_FAMILY" \
            --status ACTIVE \
            --sort DESC \
            --query 'taskDefinitionArns' \
            --output text); do
            FAMILY=$(aws ecs describe-task-definition \
              --task-definition "$arn" \
              --include TAGS \
              --query 'taskDefinition.family' \
              --output text)
            SOURCE=$(aws ecs describe-task-definition \
              --task-definition "$arn" \
              --include TAGS \
              --query "tags[?key=='ConfigurationSource'].value | [0]" \
              --output text)
            if [ "$FAMILY" = "$ECS_TASK_DEFINITION_FAMILY" ] && [ "$SOURCE" = "TerraformBaseline" ]; then
              BASE_TASK_DEF="$arn"
              break
            fi
          done
          test -n "$BASE_TASK_DEF"
          echo "BASE_TASK_DEF=$BASE_TASK_DEF" >> "$GITHUB_ENV"

      - name: Build next task definition
        env:
          EXERCISE_ROLLBACK: ${{ inputs.exercise_rollback }}
        run: |
          release_version="${GITHUB_SHA::7}"
          if [[ "$EXERCISE_ROLLBACK" == "true" ]]; then
            release_version="rollback-exercise-$release_version"
          fi
          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEF" \
            --query taskDefinition > task-definition.json

          jq \
            --arg IMAGE "$IMAGE_URI" \
            --arg CONTAINER "$CONTAINER_NAME" \
            --arg SHA "$release_version" \
            '.containerDefinitions |= map(
              if .name == $CONTAINER then
                .image = $IMAGE |
                .environment = ((.environment // []) | map(select(.name != "APP_VERSION")) + [{"name":"APP_VERSION","value":$SHA}])
              else . end
            ) |
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' task-definition.json > new-task-definition.json

          candidate_mode=$(jq -er --arg name "$CONTAINER_NAME" '.containerDefinitions[] | select(.name == $name) | ([.environment[]? | select(.name == "DB_MODE") | .value][0] // "fixture")' new-task-definition.json)
          echo "CANDIDATE_DB_MODE=$candidate_mode" >> "$GITHUB_ENV"
          if [[ "$candidate_mode" == rds || "$PREVIOUS_DB_MODE" == rds ]]; then
            test -n "$RDS_SMOKE_EVENT" && test "$RDS_SMOKE_EVENT" != "Portfolio rehearsal" || { echo "Set an RDS-only smoke event before deployment" >&2; exit 1; }
          fi

      - name: Register task definition
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"

      - name: Deploy
        id: deploy
        continue-on-error: true
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

      - name: Smoke test
        shell: bash
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_ENV: ${{ inputs.environment }}
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: |
          test -n "$SERVICE_URL"
          case "$SERVICE_URL" in
            https://*) ;;
            *) echo "SERVICE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --retry 5 --retry-delay 5 "$SERVICE_URL/health" |
            python "$GITHUB_WORKSPACE/project-2-ecs-cicd/verify-release-health.py" "${GITHUB_SHA::7}" "$EXPECTED_ENV"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 10 --retry 3 "${SERVICE_URL%/}/api/reservations" |
            python "$GITHUB_WORKSPACE/project-2-ecs-cicd/verify-reservations.py" "$CANDIDATE_DB_MODE"

          ACTIVE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)
          test "$ACTIVE" = "$TASK_DEF_ARN"
          echo "Deployment verified: $ACTIVE"

      - name: Roll back failed deployment
        shell: bash
        if: steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure'
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          EXPECTED_ENV: ${{ inputs.environment }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEF" >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          active=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          test "$active" = "$PREVIOUS_TASK_DEF"
          curl --proto '=https' --fail --silent --show-error --max-time 10 --retry 3 "$SERVICE_URL/health" |
            python "$GITHUB_WORKSPACE/project-2-ecs-cicd/verify-release-health.py" "$PREVIOUS_VERSION" "$EXPECTED_ENV"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 10 --retry 3 "${SERVICE_URL%/}/api/reservations" |
            python "$GITHUB_WORKSPACE/project-2-ecs-cicd/verify-reservations.py" "$PREVIOUS_DB_MODE"
          echo "Previous release verified after rollback"
          exit 1
