<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1180" viewBox="0 0 560 1180" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Foundation: request and evidence</title><desc id="svg-desc">Public ALB and WAF to private EC2 and RDS; separate alarm and logs feed an advisory investigator.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto-start-reverse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#24776d"/></marker></defs><rect x="0" y="0" width="560" height="1180" rx="12" fill="#f6f8f7" stroke="#f6f8f7" stroke-width="2" /><rect width="560" height="72" fill="#193d3f"/><text x="20" y="46" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#fff">Foundation: request and evidence</text><text x="20" y="113" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">REQUEST PATH</text><rect x="20" y="140" width="518" height="111" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="182" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">PUBLIC HTTPS</text><text x="41" y="220" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">ALB + WAF + ACM</text><path d="M280 253 V286" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="300" width="518" height="111" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="342" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">PRIVATE EC2</text><text x="41" y="380" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Application in two AZs</text><path d="M280 413 V447" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="462" width="518" height="111" rx="12" fill="#e4f1ed" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="504" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">PRIVATE ENCRYPTED RDS</text><text x="41" y="542" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">IAM authentication + TLS</text><path d="M280 575 V605" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="619" width="518" height="87" rx="12" fill="#fff" stroke="#bfd0cd" stroke-width="2" /><text x="40" y="653" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Snapshot · PITR · AWS Backup</text><text x="40" y="688" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Recovery verified with known rows</text><text x="20" y="758" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">INCIDENT EVIDENCE PATH</text><rect x="20" y="783" width="518" height="108" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="825" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">CloudWatch alarm + logs</text><text x="41" y="863" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Trigger and evidence are separate</text><path d="M280 893 V919" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="932" width="518" height="108" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="974" font-size="26" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">EventBridge → Lambda → AI</text><text x="41" y="1012" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Bounded logs · redact · validate</text><path d="M280 1042 V1068" stroke="#24776d" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)"/><rect x="20" y="1082" width="518" height="75" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="40" y="1115" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">S3 + DynamoDB → SNS → SQS</text><text x="40" y="1145" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Saved report, no auto-repair</text></svg>