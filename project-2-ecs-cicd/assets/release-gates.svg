<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1160" viewBox="0 0 560 1160" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Two independent release safeguards</title><desc id="svg-desc">Two distinct recorded drills: an unhealthy ECS deployment recovers with the ECS circuit breaker; a healthy but wrong application version is rejected and rolled back by GitHub Actions.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="8.5" refY="5" orient="auto-start-reverse" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#24776d"/></marker></defs><rect width="560" height="1160" fill="#f6f8f7"/><rect width="560" height="72" fill="#193d3f"/><text x="20" y="46" font-size="28" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Two independent release safeguards</text><text x="20" y="110" font-size="21" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">AUTOMATED RELEASE PATH</text><rect x="20" y="130" width="520" height="94" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="167" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Build · test · scan</text><text x="41" y="200" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">GitHub Actions OIDC → immutable ECR image</text><path d="M280 225 V256" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="20" y="268" width="520" height="94" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="41" y="305" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">Deploy candidate</text><text x="41" y="338" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">ECS Fargate · private tasks</text><text x="20" y="411" font-size="20" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">TWO SEPARATE LIVE FAILURE EXERCISES</text><rect x="20" y="434" width="520" height="299" rx="12" fill="#eaf1f7" stroke="#bfd0cd" stroke-width="2" /><text x="43" y="472" font-size="25" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">A  ·  ECS TASK FAILURE</text><text x="43" y="506" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">New tasks cannot stabilize</text><path d="M280 519 V545" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="43" y="557" width="474" height="83" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="63" y="589" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">ECS deployment circuit breaker</text><text x="63" y="618" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">restores previous service</text><text x="43" y="689" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">13m 47s  ·  separate ECS drill</text><rect x="20" y="763" width="520" height="322" rx="12" fill="#e4f1ed" stroke="#bfd0cd" stroke-width="2" /><text x="43" y="801" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">B  ·  HEALTHY TASKS, WRONG VERSION</text><text x="43" y="836" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">HTTPS returns an unexpected revision</text><path d="M280 852 V879" fill="none" stroke="#24776d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="43" y="891" width="474" height="107" rx="12" fill="#ffffff" stroke="#bfd0cd" stroke-width="2" /><text x="63" y="925" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#193d3f">GitHub Actions rejects candidate</text><text x="63" y="955" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Restores previous task definition</text><text x="63" y="985" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Verifies earlier version over HTTPS</text><text x="43" y="1049" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif" fill="#24776d">3m 23s  ·  separate Actions drill</text><text x="20" y="1130" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif" fill="#405a5d">Later DB-aware checks: simulated tests only</text></svg>